# ~/.config/kitty/kitty.conf — Netmask OS

font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Netmask colors ---
foreground            #E6E9F0
background            #0D0D1A
selection_foreground  #E6E9F0
selection_background  #2B2B4A
cursor                #00D9FF
cursor_text_color     #0D0D1A
url_color             #00D9FF
url_style             curly

# 16-color palette (netmask themed)
color0  #1A1A2E
color8  #4A4A6A
color1  #E94560
color9  #FF6B81
color2  #3DDC97
color10 #6FF0C0
color3  #FFD166
color11 #FFE49B
color4  #3D9BFF
color12 #7FB8FF
color5  #B490F0
color13 #D0B3FF
color6  #00D9FF
color14 #7AEBFF
color7  #C8CBE0
color15 #F2F3FA

# --- behavior ---
scrollback_lines     10000
enable_audio_bell    no
visual_bell_duration 0.0
window_padding_width 10
confirm_os_window_close  0
placement_strategy   center
shell               zsh

# --- color emoji via Noto ---
symbol_map U+1F300-U+1FAFF,U+2600-U+26FF,U+2700-U+27BF Noto Color Emoji
