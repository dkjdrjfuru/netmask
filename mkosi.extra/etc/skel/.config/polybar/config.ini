# ~/.config/polybar/config.ini — Netmask OS
# Bottom taskbar: logo | workspaces ... cpu mem | network | time | discord

[colors]
background = #0D0D1A
background-alt = #14142B
foreground = #E6E9F0
primary = #00D9FF
secondary = #E94560
dimmed = #8A8AA8

[bar/netmask]
bottom = true
width = 100%
height = 28
radius = 0
fixed-center = false
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
line-color = ${colors.primary}
border-size = 0
padding-left = 2
padding-right = 2
module-margin-left = 1
module-margin-right = 1
separator = │
separator-foreground = ${colors.background-alt}
font-0 = "FiraCode Nerd Font:size=10;3"
font-1 = "FiraCode Nerd Font Mono:size=10;3"
font-2 = "DejaVu Sans:size=10;3"
modules-left = logo i3
modules-right = cpu memory network date discord
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3

[module/logo]
type = custom/text
content = " NETMASK"
content-foreground = ${colors.primary}
content-padding = 2
content-underline = ${colors.secondary}
content-font = 0

[module/i3]
type = internal/i3
pin-workspaces = false
show-urgent = true
strip-wsnumbers = false
format = <label-state>
label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors.secondary}
label-focused = %name%
label-focused-foreground = ${colors.primary}
label-focused-underline = ${colors.primary}
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-foreground = ${colors.dimmed}
label-unfocused-padding = 1
label-visible = %name%
label-visible-foreground = ${colors.foreground}
label-visible-underline = ${colors.background-alt}
label-visible-padding = 1
label-urgent = %name%
label-urgent-foreground = #0D0D1A
label-urgent-background = ${colors.secondary}
label-urgent-padding = 1

[module/cpu]
type = internal/cpu
interval = 2
format = <label> <ramp-coreload>
format-prefix-foreground = ${colors.primary}
label = %percentage%%
label-foreground = ${colors.foreground}
ramp-coreload-0 = ▁
ramp-coreload-1 = ▂
ramp-coreload-2 = ▃
ramp-coreload-3 = ▄
ramp-coreload-4 = ▅
ramp-coreload-5 = ▆
ramp-coreload-6 = ▇
ramp-coreload-7 = █
ramp-coreload-font = 1
ramp-coreload-foreground = ${colors.primary}
format-warn = <label-warn>
format-warn-foreground = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 3
format = <label>
format-prefix = ""
format-prefix-font = 1
format-prefix-foreground = ${colors.primary}
label = %percentage_used%%
label-foreground = ${colors.foreground}

[module/network]
type = internal/network
interface = net*
interval = 2
format-connected = <label-connected>
format-connected-prefix = ""
format-connected-prefix-font = 1
format-connected-prefix-foreground = ${colors.primary}
label-connected = %downspeed%  %upspeed%
label-connected-foreground = ${colors.foreground}
format-disconnected = <label-disconnected>
format-disconnected-prefix = ""
format-disconnected-prefix-font = 1
format-disconnected-prefix-foreground = ${colors.secondary}
label-disconnected = offline
label-disconnected-foreground = ${colors.secondary}

[module/date]
type = internal/date
interval = 5
time = %H:%M
time-alt = %a %d %b %H:%M
format = <label>
format-prefix = ""
format-prefix-font = 1
format-prefix-foreground = ${colors.primary}
label = %time%
label-foreground = ${colors.primary}

[module/discord]
type = custom/text
content = " discord.gg/netmask"
content-foreground = ${colors.secondary}
content-padding = 1
content-font = 0
