# Netmask OS — mkosi configuration (requires mkosi >= 24)
[Distribution]
Distribution=debian
Release=bookworm
Architecture=x86-64
Mirror=https://deb.debian.org/debian

[Output]
Output=netmask-os-rootfs
OutputDirectory=output
Format=directory

[Content]
CleanPackageMetadata=true
WithDocs=false
Hostname=netmask
Timezone=UTC
Locale=C.UTF-8
Packages=
    linux-image-amd64
    systemd
    dbus
    dbus-user-session
    libpam-systemd
    network-manager
    sudo
    nano
    less
    i3-wm
    polybar
    kitty
    feh
    xinit
    xauth
    xserver-xorg-core
    xserver-xorg-input-libinput
    xserver-xorg-video-fbdev
    xserver-xorg-video-vesa
    x11-xserver-utils
    zsh
    fonts-firacode
    fonts-noto-color-emoji
    live-boot
